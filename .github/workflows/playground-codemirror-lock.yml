name: Playground CodeMirror lock helper

on:
  push:
    branches:
      - dev/playground-codemirror
    paths:
      - ".github/workflows/playground-codemirror-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terrain-de-jeu/package-lock.json
      - name: Generate and commit deterministic CodeMirror lock
        working-directory: terrain-de-jeu
        run: |
          npm install --package-lock-only --ignore-scripts             codemirror@^6             @codemirror/state@^6             @codemirror/language@^6             @lezer/highlight@^1             @codemirror/lang-python@^6             @codemirror/lang-html@^6             @codemirror/lang-css@^6             @codemirror/lang-javascript@^6
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terrain-de-jeu/package.json terrain-de-jeu/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: lock CodeMirror dependencies"
          git push origin HEAD:dev/playground-codemirror
