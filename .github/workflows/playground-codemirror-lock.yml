name: Playground CodeMirror lock helper

on:
  push:
    branches:
      - dev/playground-codemirror
    paths:
      - ".github/workflows/playground-codemirror-lock.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terrain-de-jeu/package-lock.json
      - name: Generate deterministic CodeMirror lock
        working-directory: terrain-de-jeu
        run: |
          npm install --package-lock-only --ignore-scripts             codemirror@^6             @codemirror/lang-python@^6             @codemirror/lang-html@^6             @codemirror/lang-css@^6             @codemirror/lang-javascript@^6
      - uses: actions/upload-artifact@v4
        with:
          name: playground-codemirror-lock
          path: |
            terrain-de-jeu/package.json
            terrain-de-jeu/package-lock.json
          if-no-files-found: error
          retention-days: 1
