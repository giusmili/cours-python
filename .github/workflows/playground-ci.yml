name: Terrain de jeu CI

on:
  push:
    branches:
      - kevin/missions
      - "dev/**"
  pull_request:
    paths:
      - "terrain-de-jeu/**"
      - "moodle-plugin/mod/lgcplayground/**"
      - "docs/terrain-de-jeu/**"
      - ".github/workflows/playground-ci.yml"

permissions:
  contents: read

jobs:
  verify-standalone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terrain-de-jeu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terrain-de-jeu/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Shellcheck deploy helpers
        run: shellcheck ops/playground-dev-deploy ops/playground-dev-dispatch ops/playground-dev-request ops/install-playground-dev-broker scripts/deploy-preview.sh

      - name: Build preview image
        run: docker build -f ops/Dockerfile.preview -t playground-dev:ci .

  verify-moodle-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          find moodle-plugin/mod/lgcplayground -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: XML syntax
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('moodle-plugin/mod/lgcplayground/db/install.xml')
          print('install.xml well-formed')
          PY

      - name: Moodle React/runtime artifacts present
        run: |
          test -s moodle-plugin/mod/lgcplayground/js/esm/src/view.tsx
          test -s moodle-plugin/mod/lgcplayground/js/esm/src/pythonRuntime.ts
          test -s moodle-plugin/mod/lgcplayground/js/esm/build/view.js
          test -s moodle-plugin/mod/lgcplayground/js/esm/build/pythonRuntime.js
          test -s moodle-plugin/mod/lgcplayground/pyodide-worker.mjs
          test -s moodle-plugin/mod/lgcplayground/tools/prepare-pyodide.mjs
